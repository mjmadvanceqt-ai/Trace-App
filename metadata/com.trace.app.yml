AutoName: Trace
Summary: Plan, save, run, and share walking routes
Description: |
  Trace is a mobile-first walking and route-planning app.
  .
  Features include:
  * Draw routes on OpenStreetMap using Leaflet.
  * Snap routes to roads with public OSRM-compatible routing services.
  * Save, plan, run, and share traces.
  * Track pace and simulate an active run.
  .
  Trace is free software released under the GNU General Public License,
  version 3 or later.

